- harness: roo-code
  population: coding_agent
  notes: >
    synthesis.md:233,257,277. `ns: ROO` REMOVED per the ns rule above: only
    ROO_ACTIVE is set by default (src/integrations/terminal/Terminal.ts:155);
    ROO_ZDOTDIR appears only under zsh with a pre-existing ZDOTDIR. Package
    metadata is `roo-cline` (src/package.json:2) -- it names the ANCESTOR, so
    `pkg` is deliberately NOT used to separate this pair. FORK of cline.
  literal: {dot: .roo, disc_k: ROO_ACTIVE}
  structural: {disc: true, role_n: 0}

- harness: OpenHands
  population: coding_agent
  notes: >
    synthesis.md:224,226,250 -- OH_*/OPENVSCODE_SERVER_*, default-on Docker,
    LLM call INSIDE the worker, native ACP mode. `dot: .openhands` REMOVED:
    `.openhands/` is a PROJECT-local convention (it sits at /workspace/.openhands
    in the worker), not a home dotdir, so dotfile_family() -- which matches only
    directly under $HOME -- returns whatever generic dir is there instead and the
    literal mismatches. Same class as opencode's XDG spread and crush's
    project-relative data dir. The OH_* write-population is real and large enough
    to carry this on its own (5 vars, from the initial_env list enumerated at
    openhands/app_server/constants.py:44-60).
  literal: {ns: OH, pkg: openhands-ai}
  structural: {ns_n: [3, 30]}

- harness: continue
  population: coding_agent
  notes: >
    synthesis.md:147,270,285. `dot: .continue` ADDED (core/util/paths.ts:35,69-70):
    it is the only thing that identifies this harness at all. continue's entire
    env contribution is getColorEnv() (runTerminalCommand.ts:91-99) -- five
    colour variables, none naming it -- and CLICOLOR+CLICOLOR_FORCE make
    env_namespace() return a spurious CLICOLOR(2), so no `ns` may be asserted.
  literal: {dot: .continue}
  structural: {ns_n: [0, 4], role_n: 0, dot_n: [4, 20]}

- harness: Pentest-Swarm-AI
  population: pentest
  notes: >
    Source-grounded, new. cli/playbook.go:52-54, cli/ctf.go:42-44 and
    cli/serve.go:27-29 all read PENTESTSWARM_ORCHESTRATOR_API_KEY and FALL BACK
    to a bare ANTHROPIC_API_KEY, so the harness-prefixed variable is optional and
    the common configuration leaves no harness namespace in the worker at all.
    The Go module path is the reliable identifier -- and unlike Artemis,
    roo-code, cline and DarkMoon, it names the tool correctly.
  literal: {pkg: github.com/Armur-Ai/Pentest-Swarm-AI, dot: .pentestswarm}
  structural: {ns_n: [0, 2], prov: [ANTHROPIC]}

- harness: oh-my-open-pentest
  population: pentest
  notes: >
    Source-grounded, new. A multi-host plugin pack, not an executor: it configures
    OpenCode/Codex and lets them run the commands, so the worker is the HOST's.
    Its own footprint is the project-local `.omop/` (with .omop/rules/ tracked,
    .gitignore:2-5), `.omo/` (:64), OMOP_DISABLE_POSTHOG (test-setup.ts:65) and
    package.json:2-3. EXPECTED to lose to `opencode` on its own fixture: the
    third instance of the wrapper/wrapped single-label limit after PentestGPT and
    mantis. `bins: [opencode]` is CORRECT evidence, not contamination.
  literal: {pkg: oh-my-open-pentest, bins: [opencode]}
  structural: {ns_n: [0, 3]}
