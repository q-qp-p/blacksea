    ROLE_N REMOVED 2026-07-23, and this entry is now deliberately UNSATISFIABLE
    on its own. Adding `role_n: 0` took this signature's score on an ordinary
    developer laptop (NEGATIVE.devbox) from 0.20 to 0.44 against a 0.45 floor --
    one hundredth from a false positive -- because every predicate here is an
    ABSENCE ("no namespace", "some density", "no role-named model vars") and an
    empty machine satisfies all of them. The specificity guard in inference.py
    now blocks this class outright, so what remains is honest: RedAmon is not
    identifiable through any channel the published recipe transmits. It IS
    identifiable from its cwd (`/root/redamon/`, `redamon.db`) -- see the
    transmit-cwd-paths fix in report.md 3.3.

    optimization session (2026-07-23): `cwd: redamon` ADDED, closing that gap
    -- the cwd dir itself (`/root/redamon`) plus `redamon.db` inside it form a
    2-member family cwd_family() now folds. `_family()`'s dens<=2 override no
