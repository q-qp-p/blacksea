    optimization session (2026-07-23): `dot: .xalgorix.env` CORRECTED to
    `.xalgorix` -- dotfile_family()'s regex previously matched a dot-file's
    WHOLE name (stopping only at '/' or end of string), so a single dot-file
    like `.xalgorix.env` keyed as the literal string `.xalgorix.env`. Fixing
    that same regex to fold multi-extension dot-files to their leading token
    (the aider fix, FIXTURES.md "four ways the dotdir probe misses" #4) is a
    GLOBAL, shared change -- it also changes what a single dot-file yields,
    turning `.xalgorix.env` into `.xalgorix`. This signature silently broke
    (xalgorix HIT -> ABSTAIN) until caught by the before/after fixture diff
    this session's regression check ran specifically to catch this class of
    problem.
  literal: {dot: .xalgorix, pkg: github.com/xalgord/xalgorix/v4}
  structural: {ns_n: [0, 2]}

