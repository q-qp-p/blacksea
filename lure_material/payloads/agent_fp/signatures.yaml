# Harness signatures -- the inference module's knowledge base.
#
# Defensive research.
#
# UPSTREAM SOURCES, AND WHERE THEY ARE NOT: this knowledge base was built during a
#   separate agent-harness study. That study's working documents -- synthesis.md,
#   report.md, validation_design.md, FIXTURES.md, USAGE.md, optimization/report.md,
#   the harness_notes/ and fixtures/ directories, and the extractor tools/extract.py
#   -- are NOT part of the Blacksea repository and do not ship with it. The
#   <doc>.md:<line> citations in the per-entry notes below point into that study, and
#   the <file>:<line> citations point into each fingerprinted harness's own source
#   tree; both are kept as an audit trail for where a signature came from, not as
#   paths resolvable from here. Everything needed to USE this knowledge base is in
#   this file plus listener.py.
#
# PROVENANCE RULE, and it differs from the one governing fixtures:
#   Signatures MAY be written from the study's synthesis and report -- the
#   classifier is *supposed* to encode the study's conclusions; that is what is
#   being tested.
#   Fixtures MAY NOT. A fixture written from the same notes as the signature that
#   matches it measures self-consistency and nothing else. Fixtures come from
#   harness SOURCE, extracted mechanically from each harness's own code.
#
# Fields:
#   literal.*    exact strings. Discriminative now, brittle across versions.
#   structural.* shapes. Weaker here, stronger against a renamed variable.
#                A [lo, hi] pair is an inclusive numeric range.
#                A list of strings is a membership test.
# Any field may be omitted; omission means "no expectation", never "expect absent".
#
# STATUS (2026-07-23): the fixture corpus is COMPLETE -- all 32 in-scope harnesses
# have a fixture, and no entry below is untested. Any future entry added without a
# fixture should be marked `fixture: none` so its untested status stays visible.
#
# RULE FOR `literal.ns`, adopted 2026-07-23 after the cline/roo-code pair:
#   Set `ns` ONLY when the harness sets >=2 same-prefixed variables INTO THE
#   WORKER. A namespace that exists only in the orchestrator, in config-file
#   schemas, or as a repo-wide textual population does not belong here.
#   `ns` carries the heaviest literal weight in the scheme (0.55), and a
#   MISMATCH is scored 0.0 -- so an `ns` the worker never sees does not merely
#   fail to help, it actively suppresses the correct harness. Both cline and
#   roo-code were missed this way: each sets exactly ONE prefixed variable
#   (CLINE_ACTIVE / ROO_ACTIVE), while five editor-owned VSCODE_* keys win
#   `env_namespace()` outright. Same failure as gemini-cli, where a PROVIDER
#   prefix shadows the harness family. Two capture mechanisms, one lesson:
#   prefer `disc_k` and `dot` where the worker-side family is thin.

- harness: CAI
  population: pentest
  notes: "synthesis.md:250,274; mechanically confirmed: 55 env names, CAI_* = 30, CTF_* = 6"
  literal:
    ns: CAI
    dot: .cai
    pkg: cai-framework
  structural:
    ns_n: [5, 60]
    role_n: 0
    prov: [OPENAI]

- harness: Artemis
  population: pentest
  notes: >
    THE HARD WRAPPER. No ARTEMIS_* namespace; CODEX_* inherited intact; pyproject
    names the wrapped tool (codex-supervisor). Only its added argv flags separate
    it from plain codex. harness_notes/Artemis.md addendum 2026-07-23.
  literal:
    pkg: codex-supervisor
    bins: [codex]
    flags: ["--instance-id", "--wait-for-followup"]
  structural:
    role_n: [2, 12]
    ns_n: [0, 2]

- harness: PentAGI
  population: pentest
  notes: >
    THE HARD NEGATIVE. Worker container gets no Env: at all (client.go), stock
    debian:latest, crc32 hostname (client.go:240). Inference SHOULD abstain here;
    this entry exists only so the abstention is a deliberate outcome, not an
    accident of having no entry.
  structural:
    dens: [0, 2]
    host: [hex8]
    ns_n: [0, 0]

