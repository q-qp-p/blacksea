- harness: RedAmon
  population: pentest
  notes: >
    synthesis.md:224,284. RESOLVES FIXTURES.md discrepancy 1: the extractor's
    KB(11) is the KNOWLEDGE-BASE subsystem prefix (README.md:300-303), not a
    harness namespace, so synthesis's "no recurring prefix" claim stands and the
