- harness: STRIX
  population: pentest
  notes: >
    synthesis.md:224,235,258. CORRECTED from source: `ns: STRIX` and
    `ns_n: [2,20]` REMOVED -- the container env (docker_runtime.py:146-152) has
    exactly ONE STRIX_* var, while TOOL_SERVER_PORT/TOOL_SERVER_TOKEN form a
    2-member family, so env_namespace() returns TOOL. The identifying signal is
    the hostname: `strix-scan-<scan_id>` set as both name and hostname
    (:112,138-139), which hostname_shape() reads as named-suffixed. A separated
    worker that names itself in $HOSTNAME -- the informative contrast with
    PentAGI, whose worker is genuinely blank.

    optimization session (2026-07-23): `host_lit: strix-scan` ADDED --
    hostname_shape() reduces the hostname to the shape token, discarding the
    identifying substring; host_lit is the literal counterpart read from the
    same value. Without it STRIX's only evidence is structural ranges that
    Decepticon's signature ALSO happens to satisfy on this fixture (ns_n=2,
    dens=4, role_n=0 all fall inside Decepticon's own ranges), so STRIX
    previously lost to Decepticon 0.44 vs 0.31 -- an unanticipated collision
    the corpus had not flagged because neither side was a *named* verdict.
  literal: {host_lit: strix-scan}
  structural: {host: [named-suffixed], ns_n: [0, 3], dens: [1, 8]}

