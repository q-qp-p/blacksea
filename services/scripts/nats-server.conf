# Blacksea NATS server configuration (committed; secrets are NOT in this file).
#
# $NATS_PASS is expanded from the container environment at load time — docker-compose passes it
# in from secrets/env (generated by `make secrets`). The repo holds the config shape, never the
# credential.
#
# The BAITS JetStream stream (subjects bait.>) is created by the edge/brain clients on connect,
# not declared here.

port: 4222
http_port: 8222          # monitoring: curl http://localhost:8222/healthz

jetstream {
  store_dir: "/data/jetstream"

  # Server-level hard backstop against disk exhaustion: even a future
  # mis-provisioned or unbounded stream cannot exceed this on-disk ceiling. It is the SERVER cap;
  # the primary, per-stream limit is the BAITS stream's own MaxBytes (default 1 GiB — see
  # NATS_MAX_BYTES in src/blacksea/config/settings.py and edge/config.go).
  #
  # $NATS_MAX_FILE_STORE is expanded from the container env (docker-compose passes it, default 4GB).
  # It is tunable rather than hardcoded so it can be raised in lockstep with NATS_MAX_BYTES: the cap
  # MUST stay above the per-stream MaxBytes, or NATS rejects stream creation and the edge exits.
  max_file_store: $NATS_MAX_FILE_STORE
  max_memory_store: 256MB
}

# Single shared credential for now: enough to satisfy "no anonymous access, generated secret".
#
# HARDENING (not yet done): split this into per-role users so the internet-facing edge is PUBLISH-ONLY on
# bait.> and cannot subscribe to (exfiltrate) honeypot telemetry if the edge box is compromised.
# That requires JetStream API/_INBOX ACL tuning — tracked in edge/context.md. Do not fold it in
# here until it can be tested end-to-end.
authorization {
  user: blacksea
  password: $NATS_PASS
}
