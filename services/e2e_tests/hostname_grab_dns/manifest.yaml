bait_id: hostname-beacon-dns
version: "1.0.0"
description: >
  Example bait: collects the attacker host's name and beacons it out via DNS
  (tier-0, signal-only channel — see edge/context.md's DNS projection spec). DNS sibling of
  hostname-beacon: same identity staging vessel, same collected field, different
  wire channel. Not grounded in observed attacker behavior — for development
  and testing only.

assurance_tier: 0          # tier-0: DNS signal only — unsigned/unencrypted by channel definition
deploy_class: portable_artifact
isolation_class: in_process
test: true                 # example bait — not real intel; flagged in the registry + observer

channels:
  dns: {}

envelope_version: 1

# payload/listener/vessel are cataloged in lure_material/ (repo root, sibling of services/),
# not copied locally — see lure_material/README.md. Resolved by the factory/ingestion/brain
# pool via plain os.path.join(bait_dir, <this path>), so a "../"-relative path out of this
# bait's directory works with no code changes.
listener_class: ../../../lure_material/payloads/hostname_grab_dns/listener.HostnameGrabDNSListener
payload_file: ../../../lure_material/payloads/hostname_grab_dns/payload.py
staging_vessel: ../../../lure_material/staging_vessels/identity

# Constants the factory injects into payload.py before bundling.
build_vars:
  - _ZONE          # DNS canary zone, e.g. "cb.example.com" — must match the edge's DNS_ZONES
  - _TOKEN         # hex-encoded instance_token (8 bytes)
  - _DNS_SERVER    # "host:port" queried directly via raw UDP, bypassing the OS resolver.
                   # Local/test only — a real deployment should pass --set _DNS_SERVER=
                   # (empty) and rely on public DNS delegation of the zone to the edge.

# Deploy-time parameters — makes this manifest self-sufficient for `forge`
# (register → build → approve in one call). CLI flags (--campaign/--callback/--set)
# override these for local testing; e2e_test.sh repoints both at the local dev edge.
deploy:
  campaign: example-hostname-grab-dns
  callbacks:
    dns: cb.example.com            # the zone name — matches the dev edge's default DNS_ZONES
  build_vars:
    _DNS_SERVER: "127.0.0.1:15353" # matches the dev edge's default DNS_ADDR (:15353)
  # approve: true                  # default; set false to stop at a pending instance

provenance:
  behavior: >
    Example only — not grounded in an observed attacker behavior. Not for
    live deployment.
  source: services/e2e_tests/hostname_grab_dns/
  observed_date: "2026-07-14"

retention_days: 7

build:
  toolchain: python3.11
  target_arch:
    - x86_64-linux
