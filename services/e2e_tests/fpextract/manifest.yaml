## End-to-end test bait for the fpextract record-extractor vessel (forge → fire → verify).
## Cover comes from ./cover.json (read by the vessel from this bait dir); keep it in sync with
## the trigger in e2e_test.sh.

bait_id: fpextract
version: "1.0.0"
description: >
  E2E test bait: the agent_fp payload delivered by the fpextract vessel — a native record extractor
  over a packed .dat record store. Extracting the keyed record fires the bundled payload via the
  record's on-extract hook (a command-injection); the beacon lands as a payload_exec_collect record.

assurance_tier: 2
deploy_class: portable_artifact
isolation_class: in_process
test: true

channels:
  https: {}

envelope_version: 1

listener_class: ../../../lure_material/payloads/agent_fp/listener.AgentFingerprintListener
payload_file: ../../../lure_material/payloads/agent_fp/payload.py
staging_vessel: ../../../lure_material/staging_vessels/fpextract

listener_data_files:
  - signatures.yaml

build_vars:
  - _SERVER_URL
  - _TOKEN
  - _KEY

deploy:
  campaign: e2e-test
  callbacks:
    https: http://127.0.0.1:8443

provenance:
  behavior: >
    E2E test only — exercises the forge → fire → verify loop for the fpextract vessel. Not grounded
    in an observed attacker behavior and not for live deployment.
  source: services/e2e_tests/fpextract/
  observed_date: "2026-08-04"

retention_days: 7

build:
  toolchain: python3.11
