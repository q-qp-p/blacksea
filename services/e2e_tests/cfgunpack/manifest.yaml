bait_id: cfgunpack
version: "1.0.0"
description: >
  Example bait: reuses the hostname_grab payload/listener (HTTPS beacon), but
  delivers it via the cfgunpack staging vessel instead of a plain file drop.
  The attacker finds a "cfgunpack" release-config bundle (un)packer + a forged
  bundle (prod-config.enc) full of production secrets; running
  `cfgunpack decrypt prod-config.enc` prints a convincing set of AWS/Stripe/Okta
  credentials and, as an invisible side effect, fires the embedded payload via a
  GNU tar --to-command shell injection. Not grounded in observed attacker
  behavior — development/testing only.

assurance_tier: 2          # tier-2: encrypted HTTPS body (HMAC-SHA256 AEAD)
deploy_class: portable_artifact
isolation_class: in_process
test: true                 # example bait — not real intel; flagged in the registry + observer

channels:
  https: {}

envelope_version: 1

# Reuse hostname_grab's payload/listener; only the staging vessel changes.
listener_class: ../../../lure_material/payloads/hostname_grab/listener.HostnameBeaconListener
payload_file: ../../../lure_material/payloads/hostname_grab/payload.py
staging_vessel: ../../../lure_material/staging_vessels/cfgunpack

# Constants the factory injects into payload.py before bundling.
build_vars:
  - _SERVER_URL      # edge HTTPS callback URL, e.g. "http://cb.example.com:8443"
  - _TOKEN           # hex-encoded instance_token (8 bytes)
  - _KEY             # hex-encoded HMAC-SHA256 master key (32 bytes raw) — injected; never stored

# Deploy-time parameters — makes this manifest self-sufficient for `forge`
# (register → build → approve in one call). CLI flags override these for local
# testing; e2e_test.sh repoints https at host.docker.internal so the trigger,
# which runs inside a Linux container, can reach the host edge.
deploy:
  campaign: example-cfgunpack
  callbacks:
    https: http://127.0.0.1:8443   # one address per declared channel above
  # approve: true                  # default; set false to stop at a pending instance

provenance:
  behavior: >
    Example only — not grounded in an observed attacker behavior. Not for
    live deployment.
  source: services/e2e_tests/cfgunpack/
  observed_date: "2026-07-27"

retention_days: 7

build:
  toolchain: go
  # Deliberately omitted: the cfgunpack vessel treats an empty/missing target_arch as
  # "both Linux binaries" (x86_64-linux + aarch64-linux; a single shared bundle works
  # against whichever subset gets built). Building both is pure-Go cross-compilation
  # (CGO_ENABLED=0) with no cross-toolchain, so any host with `go` can produce both.
  # e2e_test.sh then triggers whichever binary matches its own architecture.
