bait_id: db-restore
version: "1.0.0"
description: >
  Example bait: reuses the hostname_grab payload/listener (HTTPS beacon), but
  delivers it via the db-restore staging vessel instead of a plain file drop.
  The attacker finds a "db-restore" encrypted-backup tool + a forged .dbk backup
  + a restore runbook; running `db-restore restore prod-nightly-2026-06-14.dbk`
  decrypts a convincing prod dump and, as an invisible forked-child side effect,
  runs the embedded payload (a planted AArch64 "native restore driver" in the
  backup body). Not grounded in observed attacker behavior — development/testing only.

assurance_tier: 2          # tier-2: encrypted HTTPS body (HMAC-SHA256 AEAD)
deploy_class: portable_artifact
isolation_class: in_process
test: true                 # example bait — not real intel; flagged in the registry + observer

channels:
  https: {}

envelope_version: 1

# Reuse hostname_grab's payload/listener; only the staging vessel changes.
listener_class: ../../../lure_material/payloads/hostname_grab/listener.HostnameBeaconListener
payload_file: ../../../lure_material/payloads/hostname_grab/payload.py
staging_vessel: ../../../lure_material/staging_vessels/db-restore

# Constants the factory injects into payload.py before bundling.
build_vars:
  - _SERVER_URL      # edge HTTPS callback URL, e.g. "http://cb.example.com:8443"
  - _TOKEN           # hex-encoded instance_token (8 bytes)
  - _KEY             # hex-encoded HMAC-SHA256 master key (32 bytes raw) — injected; never stored

# Deploy-time parameters — makes this manifest self-sufficient for `forge`
# (register → build → approve in one call). CLI flags override these for local
# testing; e2e_test.sh repoints https at host.docker.internal so the trigger,
# which runs inside a linux/arm64 container, can reach the host edge.
deploy:
  campaign: example-db-restore
  callbacks:
    https: http://127.0.0.1:8443   # one address per declared channel above
  # approve: true                  # default; set false to stop at a pending instance

provenance:
  behavior: >
    Example only — not grounded in an observed attacker behavior. Not for
    live deployment.
  source: services/e2e_tests/db_restore/
  observed_date: "2026-07-27"

retention_days: 7

build:
  toolchain: gcc
  # The db-restore vessel supports exactly one target: the shipped binary is a static
  # ARM64 Linux ELF and the planted native-driver payload is AArch64 Linux shellcode.
  # Any other target_arch fails fast in setup.sh. The binary ships prebuilt (only the
  # backup is forged per build), so this builds on any host without a cross-toolchain.
  target_arch:
    - aarch64-linux
