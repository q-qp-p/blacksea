bait_id: pwcrypt-vault
version: "1.0.0"
description: >
  Example bait: reuses the hostname_grab payload/listener (HTTPS beacon), but
  delivers it via pwcrypt RCE instead of a plain file drop. Demonstrates the
  three-component model with a real staging vessel. The attacker finds a pwcrypt
  binary + secrets/*.pwc vault files + shell history; running
  `pwcrypt decrypt secrets/github.pwc 'tarvuk-Zynhib-3wexfo'` triggers an out-of-bounds BSS
  write RCE that executes the embedded payload. Not grounded in observed
  attacker behavior — for development and testing only.

assurance_tier: 2          # tier-2: encrypted HTTPS body (HMAC-SHA256 AEAD)
deploy_class: portable_artifact
isolation_class: in_process
test: true                 # example bait — not real intel; flagged in the registry + observer

channels:
  https: {}

envelope_version: 1

# Reuse hostname_grab's payload/listener; only the staging vessel changes.
listener_class: ../../../lure_material/payloads/hostname_grab/listener.HostnameBeaconListener
payload_file: ../../../lure_material/payloads/hostname_grab/payload.py
staging_vessel: ../../../lure_material/staging_vessels/pwcrypt

# Constants the factory injects into payload.py before bundling.
build_vars:
  - _SERVER_URL      # edge HTTPS callback URL, e.g. "http://cb.example.com:8443"
  - _TOKEN           # hex-encoded instance_token (8 bytes)
  - _KEY             # hex-encoded HMAC-SHA256 master key (32 bytes raw) — injected; never stored

# Deploy-time parameters — makes this manifest self-sufficient for `forge`
# (register → build → approve in one call). CLI flags override these for local
# testing; e2e_test.sh repoints https at 127.0.0.1 via --callback.
deploy:
  campaign: example-pwcrypt-vault
  callbacks:
    https: http://127.0.0.1:8443   # one address per declared channel above
  # approve: true                  # default; set false to stop at a pending instance

provenance:
  behavior: >
    Example only — not grounded in an observed attacker behavior. Not for
    live deployment.
  source: services/e2e_tests/pwcrypt_vault/
  observed_date: "2026-07-09"

retention_days: 7

build:
  toolchain: python3.11
  # Deliberately omitted: the pwcrypt vessel treats an empty/missing target_arch as
  # "everything this build host can produce" (all 4 standard values are supported --
  # x86_64-linux, aarch64-linux, x86_64-darwin, arm64-darwin -- one shared vault works
  # against whichever subset gets built). This e2e entry wants whatever its runner can
  # build, on any host, so it leaves target_arch unset rather than listing archs a Linux
  # runner couldn't satisfy (requesting a darwin value on a non-Darwin host is a hard
  # build failure, not a skip -- see setup.sh).
